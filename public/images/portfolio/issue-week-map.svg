<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">イシュードリブン一週間マップ</title>
  <desc id="desc">一週間の仕事を時間ではなく解くべきイシューで捉える図</desc>
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#1b332f" stroke-width="1"/>
    </pattern>
    <linearGradient id="signal" x1="0" x2="1">
      <stop stop-color="#008877"/>
      <stop offset="1" stop-color="#bb5555"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="1000" fill="#0a0d0c"/>
  <rect width="1600" height="1000" fill="url(#grid)" opacity=".8"/>
  <text x="110" y="140" fill="#87cdbf" font-family="Arial, sans-serif" font-size="24" letter-spacing="8">ISSUE-DRIVEN / WEEK MAP</text>
  <text x="110" y="245" fill="#fff" font-family="sans-serif" font-size="76" font-weight="700">解くべき問いから、</text>
  <text x="110" y="335" fill="#fff" font-family="sans-serif" font-size="76" font-weight="700">一週間を組み直す。</text>
  <g transform="translate(110 470)" font-family="Arial, sans-serif">
    <path d="M0 220 C170 30 300 310 480 115 S790 45 965 165 S1190 75 1370 140" fill="none" stroke="url(#signal)" stroke-width="10" filter="url(#glow)"/>
    <g fill="#0a0d0c" stroke="#62c6b5" stroke-width="7">
      <circle cx="0" cy="220" r="20"/><circle cx="275" cy="175" r="20"/><circle cx="555" cy="90" r="20"/><circle cx="845" cy="105" r="20"/><circle cx="1115" cy="125" r="20"/><circle cx="1370" cy="140" r="20"/>
    </g>
    <g fill="#fff" font-size="18" letter-spacing="3">
      <text x="0" y="310">MON</text><text x="270" y="310">TUE</text><text x="545" y="310">WED</text><text x="835" y="310">THU</text><text x="1105" y="310">FRI</text><text x="1350" y="310">NEXT</text>
    </g>
    <g fill="#bb5555" font-size="16" letter-spacing="2">
      <text x="510" y="48">CORE ISSUE</text><text x="1080" y="86">DECISION</text>
    </g>
  </g>
  <text x="110" y="920" fill="#8a9692" font-family="Arial, sans-serif" font-size="20" letter-spacing="5">OBSERVE  →  FRAME  →  PRIORITIZE  →  ACT  →  REVIEW</text>
</svg>
