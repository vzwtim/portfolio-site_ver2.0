<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Home design directions: Field Ledger and Gomoku Broadside</title>
  <desc id="desc">Two side-by-side static desktop home-page composition studies using existing portfolio imagery.</desc>
  <defs>
    <clipPath id="photoA"><rect x="84" y="180" width="480" height="430" rx="2"/></clipPath>
    <clipPath id="photoB"><path d="M846 142H1518V512H1220L1150 584H846Z"/></clipPath>
    <style>
      .gothic{font-family:Arial,'Noto Sans JP',sans-serif}.mincho{font-family:'Yu Mincho','Hiragino Mincho ProN',serif}
      .meta{font:12px Arial,sans-serif;letter-spacing:2px}.small{font:15px Arial,'Noto Sans JP',sans-serif}.rule{stroke:#008877;stroke-width:1}
    </style>
  </defs>
  <rect width="1600" height="980" fill="#e8e8e5"/>
  <rect x="24" y="24" width="748" height="932" fill="#fff"/>
  <text x="54" y="64" class="meta" fill="#008877">DIRECTION A / RECOMMENDED</text>
  <text x="54" y="95" class="small" font-weight="700">FIELD LEDGER — 観察台帳</text>
  <line x1="54" y1="116" x2="742" y2="116" class="rule"/>
  <image href="../../public/images/babayudai_logo.svg" x="84" y="132" width="118" height="32" preserveAspectRatio="xMinYMid meet"/>
  <text x="564" y="154" class="meta" text-anchor="end">INDEX 01</text>
  <image href="../../public/images/mv_gomoku_1.jpg" x="55" y="165" width="548" height="460" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoA)"/>
  <rect x="84" y="180" width="480" height="430" fill="none" stroke="#171815"/>
  <text x="588" y="212" class="meta" fill="#bb5555" transform="rotate(90 588 212)">OBSERVE / INTERPRET / CONNECT / MAKE</text>
  <text x="84" y="676" class="mincho" font-size="49" fill="#171815">ぼくは、五目飯。</text>
  <text x="86" y="718" class="mincho" font-size="19" fill="#34342f">場所をよく見て、価値を読み解き、</text>
  <text x="86" y="748" class="mincho" font-size="19" fill="#34342f">人と仕組みをつなぎながら、使える形まで。</text>
  <line x1="84" y1="786" x2="564" y2="786" stroke="#171815"/>
  <text x="84" y="818" class="meta" fill="#008877">SELECTED STORIES</text>
  <text x="84" y="856" class="small">01  不動産 × 分析</text><text x="565" y="856" class="meta" text-anchor="end">VIEW CASE →</text>
  <line x1="84" y1="873" x2="564" y2="873" stroke="#aaa79e"/>
  <text x="84" y="908" class="small">02  場所 × フィールドワーク</text><text x="565" y="908" class="meta" text-anchor="end">EXPLORE →</text>

  <rect x="796" y="24" width="780" height="932" fill="#fff"/>
  <text x="826" y="64" class="meta" fill="#bb5555">DIRECTION B</text>
  <text x="826" y="95" class="small" font-weight="700">GOMOKU BROADSIDE — 五目新聞</text>
  <rect x="826" y="122" width="720" height="590" fill="#fff" stroke="#171815" stroke-width="2"/>
  <image href="../../public/images/mv_gomoku_1.jpg" x="846" y="142" width="672" height="442" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoB)"/>
  <rect x="856" y="162" width="102" height="28" fill="#bb5555"/><text x="907" y="181" class="meta" fill="#fff" text-anchor="middle">ISSUE 01</text>
  <rect x="846" y="574" width="672" height="10" fill="#008877"/>
  <text x="850" y="651" class="gothic" font-size="62" font-weight="900" fill="#171815">ぼくは、</text>
  <text x="1134" y="685" class="gothic" font-size="94" font-weight="900" fill="#171815">五目飯。</text>
  <image href="../../public/images/babayudai_logo.svg" x="1410" y="632" width="92" height="34" preserveAspectRatio="xMaxYMid meet"/>
  <text x="850" y="746" class="meta" fill="#008877">TODAY'S INDEX</text>
  <line x1="850" y1="762" x2="1518" y2="762" stroke="#008877" stroke-width="4"/>
  <text x="850" y="812" class="gothic" font-size="23" font-weight="700">見る</text><text x="1000" y="812" class="gothic" font-size="23" font-weight="700">読み解く</text><text x="1190" y="812" class="gothic" font-size="23" font-weight="700">動かす</text><text x="1360" y="812" class="gothic" font-size="23" font-weight="700">つくる</text>
  <line x1="850" y1="842" x2="1518" y2="842" stroke="#171815"/>
  <rect x="850" y="866" width="320" height="58" fill="#bb5555"/><text x="1010" y="902" class="small" fill="#fff" text-anchor="middle" font-weight="700">代表事例を読む →</text>
  <text x="1518" y="903" class="meta" text-anchor="end">WORK / RESEARCH / JOURNEY</text>
</svg>
